# Football no-map safety speed limits.
# Layer 1: the Football-only DWB override produces a bounded formal cmd_vel.
# Layer 2: velocity_adaptor applies the final acceleration and speed clamp.

velocity_adaptor:
  ros__parameters:
    enable_speed_limit: true
    max_linear_speed: 0.38
    max_angular_z: 0.6
    max_accel_x: 0.45
    max_accel_y: 0.24
    max_accel_yaw: 0.9
    enable_cmd_vel_watchdog: true
    cmd_vel_timeout_sec: 0.3
    require_control_valid: true
    control_valid_topic: football/control_valid