football_goal_adapter:
  ros__parameters:
    # 所有机器人位姿直接使用 tag_global；最终导航目标以本机 base_link 表达。
    target_frame: base_link
    field_frame: tag_global
    base_frame: base_link
    # 融合后的球输入；原始感知/仿真数据使用 /football/ball_pose_raw。
    ball_pose_topic: /football/ball_pose
    approach_pose_topic: football/approach_pose
    require_striker_role: true
    role_topic: football/role
    tactical_target_topic: football/tactical_target
    tactical_target_timeout_sec: 0.8
    # 团队 kick_target 是期望的球目的地，不是机器人导航目标。
    use_team_kick_target: true
    robot_namespaces_csv: cyberdog_1,cyberdog_2,cyberdog_3,cyberdog_4,cyberdog_5,cyberdog_6,cyberdog_7,cyberdog_8,cyberdog_9,cyberdog_10
    robot_odom_topic_template: /global_vio/{namespace}/odom
    cmd_vel_topic: cmd_vel
    update_rate_hz: 15.0
    ball_timeout_sec: 0.45
    max_ball_age_sec: 0.35
    future_tolerance_sec: 0.08
    odom_timeout_sec: 0.45
    role_timeout_sec: 0.8
    require_other_robot_poses: true
    other_robot_timeout_sec: 0.7
    minimum_other_robot_count: 9
    kick_target_timeout_sec: 0.8
    max_ball_odom_skew_sec: 0.12
    cmd_vel_timeout_sec: 0.35
    # 球位置 - 单位向量(球->射门目标) * 距离：得到标准球后点。
    approach_distance_m: 0.6
    approach_reached_m: 0.1
    approach_reached_exit_m: 0.18
    approach_heading_blend_distance_m: 0.45
    align_yaw_tolerance: 0.1
    alignment_reset_grace_sec: 0.25
    push_target_lead_m: 0.32
    push_enter_lateral_error_m: 0.08
    push_exit_lateral_error_m: 0.14
    push_enter_yaw_error_rad: 0.1
    push_exit_yaw_error_rad: 0.18
    push_contact_acquire_timeout_sec: 2.0
    contact_acquire_min_hold_sec: 0.30
    push_contact_stable_hold_sec: 0.20
    push_contact_progress_timeout_sec: 2.5
    push_contact_hard_timeout_sec: 8.0
    push_contact_progress_epsilon_m: 0.01
    push_alignment_loss_sec: 0.35
    push_contact_loss_sec: 0.45
    # 几何触球模型：矩形机器人轮廓与圆形球进行相交判断。
    robot_front_extent_m: 0.302
    robot_rear_extent_m: 0.301
    robot_half_width_m: 0.170
    ball_radius_m: 0.11
    contact_tolerance_m: 0.035
    ball_protection_radius_m: 0.28
    max_local_goal_distance_m: 4.0
    field_min_x: -2.0
    field_max_x: 8.0
    field_min_y: -3.0
    field_max_y: 3.0
    boundary_margin_m: 0.25
    ball_boundary_margin_m: 0.12
    approach_boundary_margin_m: 0.25
    maximum_ball_chase_distance_m: 8.0
    minimum_kick_target_distance_m: 0.3
    minimum_behind_alignment_m: 0.18
    maximum_kick_lateral_error_m: 0.08
    kick_alignment_hold_sec: 0.6
    path_block_radius_m: 0.5
    opponent_endpoint_clearance_m: 0.84
    # 标准球后点不可直接使用时，临时 staging/绕行点的横向偏移距离。
    entry_lateral_m: 0.7
    speed_limit_topic: speed_limit
    alignment_max_duration_sec: 6.0
    alignment_max_rotation_rad: 3.5
    alignment_progress_window_sec: 0.8
    alignment_min_error_improvement_rad: 0.025
    alignment_reacquire_lateral_m: 0.18
    approach_speed_limit_mps: 0.38
    obstacle_speed_limit_mps: 0.22
    ball_approach_speed_limit_mps: 0.20
    contact_acquire_speed_limit_mps: 0.07
    push_speed_limit_mps: 0.12
    robot_collision_length_m: 0.562
    robot_collision_width_m: 0.339
    collision_ellipse_expansion_m: 0.05
    obstacle_slowdown_clearance_m: 0.45
    obstacle_slowdown_exit_clearance_m: 0.60
    obstacle_stop_clearance_m: 0.03
    obstacle_reaction_time_sec: 0.35
    obstacle_braking_deceleration_mps2: 0.65
    obstacle_prediction_horizon_sec: 0.65
    ball_approach_distance_m: 1.25
    ball_approach_exit_distance_m: 1.40
    speed_limit_update_threshold_mps: 0.015
    speed_limit_refresh_sec: 0.25
football_trajectory_adapter:
  ros__parameters:
    target_frame: base_link
    input_approach_pose_topic: football/approach_pose
    output_tracking_pose_topic: tracking_pose
    publish_tracking_pose: true
    publish_goal_pose: false
    max_input_age_sec: 0.5
    future_tolerance_sec: 0.08
    tracking_pose_heartbeat_hz: 10.0
    output_tracking_heartbeat_topic: tracking_pose_heartbeat
    planner_update_rate_hz: 2.0
football_tracking_action_client:
  ros__parameters:
    enabled: true
    tracking_pose_topic: tracking_pose_heartbeat
    action_name: navigate_to_pose
    tick_rate_hz: 5.0
    tracking_pose_timeout_sec: 0.6
    role_timeout_sec: 0.8
    future_tolerance_sec: 0.08
    completed_pose_xy_tolerance: 0.05
    completed_pose_yaw_tolerance: 0.08
    expected_tracking_frame: vodom
    behavior_tree: ''
    require_striker_role: true
    role_topic: football/role
    send_period_sec: 0.2
    control_valid_topic: football/control_valid
    action_retry_initial_sec: 0.5
    action_retry_max_sec: 3.0
football_fake_ball_publisher:
  ros__parameters:
    frame_id: tag_global
    ball_topic: /football/ball_pose_raw
    publish_rate_hz: 50.0
    ball_x: 3.0
    ball_y: 0.0
    kickoff_x: 3.0
    kickoff_y: 0.0
    minimum_contact_speed_mps: 0.01
    ball_friction_mps2: 0.8
    max_sim_ball_speed_mps: 0.14
    max_ball_acceleration_mps2: 0.3
    velocity_transfer_gain: 0.85
    robot_front_extent_m: 0.25
    robot_rear_extent_m: 0.23
    robot_half_width_m: 0.13
    contact_tolerance_m: 0.035
    field_min_x: -2.0
    field_max_x: 8.0
    field_min_y: -3.0
    field_max_y: 3.0
    ball_radius_m: 0.11
    out_of_bounds_reset_sec: 1.0
    odom_topic_template: /{namespace}/odom_global
    front_contact_topic: /football/fake_ball/front_contact
    side_contact_topic: /football/fake_ball/side_contact
    rear_contact_topic: /football/fake_ball/rear_contact
    contact_robot_topic: /football/fake_ball/contact_robot
    controlled_robot_pose_seen_topic: /football/fake_ball/controlled_robot_pose_seen
    controlled_robot_pose_fresh_topic: /football/fake_ball/controlled_robot_pose_fresh
    controlled_robot_transform_valid_topic: /football/fake_ball/controlled_robot_transform_valid
    controlled_robot_seen_topic: /football/fake_ball/controlled_robot_seen
    ball_velocity_topic: /football/fake_ball/velocity
football_fake_world:
  ros__parameters:
    frame_id: tag_global
    robot_namespaces_csv: cyberdog_1,cyberdog_2,cyberdog_3,cyberdog_4,cyberdog_5,cyberdog_6,cyberdog_7,cyberdog_8,cyberdog_9,cyberdog_10
    publish_rate_hz: 50.0
    cmd_vel_topic_template: /{namespace}/cmd_vel
    odom_out_topic_template: /{namespace}/odom_out
    odom_slam_topic_template: /{namespace}/odom_slam
    tf_topic_template: /{namespace}/tf
    tag_frame_template: '{namespace}/tag_0_observation'
    publish_integrated_cmd_vel: false
    integrated_cmd_vel_topic_template: /{namespace}/football/fake_integrated_cmd_vel
    cmd_vel_timeout_sec: 0.3
    max_linear_speed_mps: 0.40
    max_angular_speed_rps: 0.65
    field_min_x: -2.0
    field_max_x: 8.0
    field_min_y: -3.0
    field_max_y: 3.0
    robot_collision_length_m: 0.562
    robot_collision_width_m: 0.339
    collision_ellipse_expansion_m: 0.05
    minimum_initial_separation_m: 0.90
    boundary_margin_m: 0.1
