# Reference only: copy into mcr_bringup/params/follow_params.yaml local_costmap_tracking.
# Do NOT load this file from football_navigation launch nodes.
#
# obstacle_layer(scan) 来自 mcr_bringup tracking 栈的激光层，不是 football_navigation 包逻辑。
# RViz 彩色区域 = obstacle_layer + multi_robot_obstacle_layer + inflation 叠加；仅测多狗圆障碍时可临时关 obstacle_layer。
local_costmap:
  local_costmap:
    ros__parameters:
      global_frame: vodom
      robot_base_frame: base_link
      rolling_window: true
      track_unknown_space: false
      always_send_full_costmap: false
      footprint: "[[0.25, 0.13], [0.25, -0.13], [-0.23, -0.13], [-0.23, 0.13]]"
      footprint_padding: 0.03
      plugins: ["obstacle_layer", "multi_robot_obstacle_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.42
      multi_robot_obstacle_layer:
        plugin: "football_navigation::MultiRobotObstacleLayer"
        enabled: true
        input_mode: "pose_array"
        target_frame: vodom
        pose_array_topic: football/other_robot_poses
        use_oriented_footprint: true
        other_robot_length_m: 0.562
        other_robot_width_m: 0.339
        other_robot_height_m: 0.481
        footprint_padding: 0.04
        obstacle_radius_m: 0.55
        obstacle_radius: 0.55
        obstacle_timeout_sec: 0.7
        transform_tolerance: 0.2
        pose_array_includes_self: false
        self_filter_radius: 0.05
        max_message_age: 0.7
        future_tolerance: 0.1
        cost_value: 254
        mark_cost: 254
        use_maximum: true