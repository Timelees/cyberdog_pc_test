football_simulation_input_publisher:
  ros__parameters:
    # 第一版固定场景。机器人命名空间和所有全局坐标都由本文件提供。
    robot_namespace: cyberdog_1
    robot_namespaces_csv: cyberdog_1,cyberdog_2,cyberdog_3,cyberdog_4,cyberdog_5,cyberdog_6,cyberdog_7,cyberdog_8,cyberdog_9,cyberdog_10
    field_frame: tag_global
    odom_topic_template: /global_vio/{namespace}/odom
    cmd_vel_topic: /cyberdog_1/cmd_vel
    publish_rate_hz: 20.0
    cmd_vel_timeout_sec: 0.5
    robot_x: 0.0
    robot_y: 0.0
    robot_yaw: 0.0
    ball_x: 3.0
    ball_y: 2.0
    kick_target_x: 8.0
    kick_target_y: 0.0
    stop_at_ball: true
    ball_contact_distance_m: 0.42
    simulate_ball_push: true
    ball_push_transfer_gain: 1.0
    ball_push_lateral_gain: 0.05

football_fake_other_robot_publisher:
  ros__parameters:
    frame_id: tag_global
    robot_namespaces_csv: cyberdog_1,cyberdog_2,cyberdog_3,cyberdog_4,cyberdog_5,cyberdog_6,cyberdog_7,cyberdog_8,cyberdog_9,cyberdog_10
    selected_namespace: cyberdog_1
    # 此 peer 只接受键盘节点发布的 cmd_vel，不受随机、scripted 或 demo 运动驱动。
    # 初始位置由同名 initial_pose_cyberdog_2 的 [x, y, yaw] 配置。
    keyboard_controlled_namespace: cyberdog_2
    simulate_selected_robot: false
    publish_acceptance_global_odom: true
    acceptance_global_odom_topic_template: /global_vio/{namespace}/odom
    # 每台机器人的 [x, y, yaw] 都可直接修改；删除某一项或设为 [] 时，
    # randomize_initial_poses=true 会仅为该机器人生成随机位置。
    randomize_initial_poses: false
    random_seed: 2026
    minimum_initial_separation_m: 0.90
    initial_pose_cyberdog_2: [1.25, 1.08, 0.0]
    initial_pose_cyberdog_3: [-4.0, -2.5, 0.0]
    initial_pose_cyberdog_4: [0.4, 1.52, 0.0]
    initial_pose_cyberdog_5: [-4.0, 2.5, 0.0]
    initial_pose_cyberdog_6: [0.0, -3.0, 3.14159]
    initial_pose_cyberdog_7: [3.5, -3.0, 3.14159]
    initial_pose_cyberdog_8: [6.5, -3.0, 3.14159]
    initial_pose_cyberdog_9: [6.5, 3.0, 3.14159]
    initial_pose_cyberdog_10: [1.4, 0.3, 3.14159]
    selected_initial_global_x: 0.0
    selected_initial_global_y: 0.0
    # cyberdog_1 由 striker cmd_vel 驱动；其余 peer 默认静止，便于动态避障测试。
    # 设为 true 时，除 keyboard_controlled_namespace 外的 peer 使用可复现随机航点。
    random_peer_motion_enabled: false
    random_peer_motion_start_delay_sec: 0.5
    random_peer_min_speed_mps: 0.08
    random_peer_max_speed_mps: 0.18
    random_peer_min_target_duration_sec: 4.0
    random_peer_max_target_duration_sec: 9.0
    random_peer_goal_tolerance_m: 0.25
    random_peer_min_travel_distance_m: 1.0
    random_peer_turn_gain: 1.8
    # 外接椭圆之间额外保留的动态净空，吸收一个发布周期内的运动误差。
    random_peer_min_clearance_m: 0.03
    scripted_peer_motion_enabled: false
    continuous_demo_enabled: false
    publish_odom_slam: false
    publish_rate_hz: 20.0
    field_min_x: -8.0
    field_max_x: 8.0
    field_min_y: -4.0
    field_max_y: 4.0
    robot_collision_length_m: 0.562
    robot_collision_width_m: 0.339
    collision_ellipse_expansion_m: 0.05
    boundary_margin_m: 0.20

football_goal_adapter:
  ros__parameters:
    field_frame: tag_global
    target_frame: tag_global
    base_frame: base_link
    ball_pose_topic: /football/ball_pose
    approach_pose_topic: football/approach_pose
    speed_limit_topic: speed_limit
    require_striker_role: true
    use_team_kick_target: true
    robot_namespaces_csv: cyberdog_1,cyberdog_2,cyberdog_3,cyberdog_4,cyberdog_5,cyberdog_6,cyberdog_7,cyberdog_8,cyberdog_9,cyberdog_10
    robot_odom_topic_template: /global_vio/{namespace}/odom
    require_other_robot_poses: true
    minimum_other_robot_count: 9
    update_rate_hz: 15.0
    approach_distance_m: 0.5
    default_kick_yaw: 0.0
    # 仿真 striker 速度分级：正常行走最快，接近足球和建立接触时逐级减速。
    approach_speed_limit_mps: 0.85
    obstacle_speed_limit_mps: 0.42
    ball_approach_speed_limit_mps: 0.38
    contact_acquire_speed_limit_mps: 0.13
    push_speed_limit_mps: 0.24
    robot_collision_length_m: 0.562
    robot_collision_width_m: 0.339
    collision_ellipse_expansion_m: 0.05
    obstacle_slowdown_clearance_m: 0.45
    obstacle_slowdown_exit_clearance_m: 0.60
    obstacle_stop_clearance_m: 0.03
    field_min_x: -2.0
    field_max_x: 8.0
    field_min_y: -4.0
    field_max_y: 4.0

football_trajectory_adapter:
  ros__parameters:
    target_frame: tag_global
    input_approach_pose_topic: football/approach_pose
    output_tracking_pose_topic: tracking_pose
    output_tracking_heartbeat_topic: tracking_pose_heartbeat
    publish_tracking_pose: true
    publish_goal_pose: false
    tracking_pose_heartbeat_hz: 10.0

football_tracking_action_client:
  ros__parameters:
    enabled: true
    tracking_pose_topic: tracking_pose_heartbeat
    action_name: navigate_to_pose
    expected_tracking_frame: tag_global
    require_striker_role: true
    require_costmap_ready: false
    tick_rate_hz: 10.0
    send_period_sec: 0.2
    tracking_pose_timeout_sec: 0.6
    role_timeout_sec: 0.8
    control_valid_topic: football/control_valid

football_simulation_navigator:
  ros__parameters:
    field_frame: tag_global
    action_name: navigate_to_pose
    odom_topic: /global_vio/cyberdog_1/odom
    cmd_vel_topic: cmd_vel
    push_cmd_vel_topic: football/push_cmd_vel
    speed_limit_topic: speed_limit
    control_state_topic: football/state
    control_rate_hz: 20.0
    linear_gain: 1.7
    angular_gain: 1.5
    push_bearing_gain: 0.6
    max_linear_speed_mps: 0.85
    max_angular_speed_rps: 1.4
    position_tolerance_m: 0.06
    yaw_tolerance_rad: 0.08
    odom_timeout_sec: 0.5
    self_namespace: cyberdog_1
    robot_namespaces_csv: cyberdog_1,cyberdog_2,cyberdog_3,cyberdog_4,cyberdog_5,cyberdog_6,cyberdog_7,cyberdog_8,cyberdog_9,cyberdog_10
    robot_odom_topic_template: /global_vio/{namespace}/odom
    local_plan_topic: local_plan
    other_robot_timeout_sec: 0.7
    # 矩形外接椭圆半轴为 length/sqrt(2)、width/sqrt(2)，再向外扩展 0.05 m。
    robot_collision_length_m: 0.562
    robot_collision_width_m: 0.339
    collision_ellipse_expansion_m: 0.05
    # 以下三个值均为两台有向椭圆边界之间的净空，而不是机器人中心距离。
    collision_hard_stop_clearance_m: 0.02
    # lattice 的首段要求 0.16 m 净空；低于该值时先搜索只会增大净空的短路径，
    # 避免首段被拒绝后在原地停车。恢复到 0.24 m 后才交还普通绕行规划。
    clearance_recovery_trigger_clearance_m: 0.16
    clearance_recovery_exit_clearance_m: 0.24
    clearance_recovery_distance_m: 1.0
    clearance_recovery_speed_mps: 0.20
    collision_path_clearance_m: 0.08
    collision_slowdown_clearance_m: 0.35
    detour_extra_clearance_m: 0.08
    local_path_lookahead_m: 0.28
    path_heading_gain: 2.4
    turn_in_place_threshold_rad: 0.75
    smooth_path_samples: 41
    # 单峰曲线无法绕开多台障碍时，沿行进方向搜索可切换左右侧的横向走廊。
    multi_obstacle_lattice_stations: 17
    multi_obstacle_lateral_step_m: 0.18
    multi_obstacle_max_lateral_m: 3.0
    multi_obstacle_max_lane_change_m: 0.54
    multi_obstacle_turn_penalty: 0.25
    # 障碍移动或转向后使缓存轨迹失效，避免继续跟踪静态快照。
    dynamic_replan_min_period_sec: 0.30
    dynamic_replan_translation_m: 0.08
    dynamic_replan_yaw_rad: 0.18
    field_min_x: -8.0
    field_max_x: 8.0
    field_min_y: -4.0
    field_max_y: 4.0

football_visualization_node:
  ros__parameters:
    field_frame: tag_global
    target_frame: tag_global
    base_frame: base_link
    ball_topic: /football/ball_pose
    approach_pose_topic: football/approach_pose
    path_topic: plan
    odom_topic: /global_vio/cyberdog_1/odom
    field_marker_topic: /football/markers/field
    robot_namespaces_csv: cyberdog_1,cyberdog_2,cyberdog_3,cyberdog_4,cyberdog_5,cyberdog_6,cyberdog_7,cyberdog_8,cyberdog_9,cyberdog_10
    robot_odom_topic_template: /global_vio/{namespace}/odom
    robot_marker_topic_template: /football/markers/robots/{namespace}
    ball_marker_topic: /football/markers/ball
    approach_marker_topic: /football/markers/approach_pose
    tracking_marker_topic: /football/markers/tracking_pose
    path_marker_topic: /football/markers/paths
    goal_marker_topic: /football/markers/goals
    costmap_marker_topic: /football/markers/costmap
    command_marker_topic: /football/markers/commands
    status_marker_topic: /football/markers/status
    self_namespace: cyberdog_1
    # 该机器人显示为红色，便于在 RViz 中识别人工干扰源。
    keyboard_robot_namespace: cyberdog_2
    team_id: a
    show_field_boundary: true
    show_ball_marker: true
    show_goal_markers: true
    show_ego_robot_marker: true
    show_other_robot_markers: true
    show_robot_collision_ellipses: true
    other_robot_length_m: 0.562
    other_robot_width_m: 0.339
    collision_ellipse_expansion_m: 0.05
    enable_costmap_markers: false
    expect_motion_cmds: false
    use_delete_all_before_publish: true
    # 可视化场地以全局原点为中心，不复用仅覆盖当前仿真工作区的导航边界。
    field_center_x: 0.0
    field_center_y: 0.0
    field_length_m: 16.0
    field_width_m: 8.0
    center_circle_radius_m: 0.75
    team_a_attack_goal_x: 8.0
    team_a_attack_goal_y: 0.0
    team_b_attack_goal_x: -8.0
    team_b_attack_goal_y: 0.0
    # 命令与状态面板固定放在边线外，不随机器人运动。
    command_panel_x: -3.0
    command_panel_y: -5.0
    status_panel_x: 1.0
    status_panel_y: -5.0
