/**:
  ros__parameters:
    status_period_sec: 5.0

    # 当前在线机器人。添加机器人时只需要追加命名空间。
    robot_namespaces: ["cyberdog_1", "cyberdog_2"]
    input_topic_prefix: /global_vio
    input_odom_topic: odom

    # mutil_robot_odom 已经将各机器人 odom_global 统一转发到 tag_global。
    # 本节点只做可视化，不再负责坐标统一和 TF 转发。
    target_frame_id: tag_global
    output_topic_prefix: /global_vio

    # 订阅本机 mutil_robot_odom 转发后的 /global_vio 话题，默认 Reliable。
    subscribe_best_effort: false
    publish_best_effort: false

    path_enabled: true
    pose_text_enabled: true
    robot_marker_enabled: true

    path_publish_every_n: 1
    marker_publish_every_n: 5
    path_max_poses: 3000

    pose_text_z_offset: 0.6
    pose_text_scale: 0.18
