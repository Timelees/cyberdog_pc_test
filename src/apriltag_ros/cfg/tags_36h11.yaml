/**:
    ros__parameters:
        image_transport: raw    # image format
        family: 36h11           # tag family name
        size: 0.127             # tag edge size in meter
        max_hamming: 0          # maximum allowed hamming distance (corrected bits)
        qos_profile: sensor_data    # optional qos_profile, "sensor_data", "default", or "system_default"

        # see "apriltag.h" 'struct apriltag_detector' for more documentation on these optional parameters
        detector:
            threads: 1          # keep NX CPU for leg TF / odom publishers
            decimate: 3.0       # decimate resolution for quad detection
            blur: 0.0           # sigma of Gaussian blur for quad detection
            refine: true        # snap to strong gradients
            sharpening: 0.25    # sharpening of decoded images
            debug: false        # write additional debugging images to current working directory


        pose_estimation_method: "pnp"   # method for estimating the tag pose

        # global_alignment_node needs live camera->tag observations. The tag
        # itself is used as the global anchor when solving tag_map->odom.
        latch_first_tag_pose: false
        publish_latched_when_lost: false
        use_first_pose_as_global: false

        # optional list of tags
        tag:
            ids: [0]            # tag ID
            # Must match global_alignment_node tag_observation_frame_id, e.g. cyberdog_1/tag_0_observation.
            # apriltag_36h11.launch.py overrides this at runtime.
            frames: [cyberdog_1/tag_0_observation]
            sizes: [0.127]   # optional tag-specific edge size
